<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
</head>

<body>
    <div class="swiper-wrap">
        <!-- 新增：可交互的左右遮罩 -->
        <div class="swiper-mask swiper-mask-left" aria-hidden="true"></div>
        <div class="swiper-mask swiper-mask-right" aria-hidden="true"></div>

        <div class="swiper-content"></div>
    </div>
</body>

<style>
    * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
    }

    :root {
        --swiper-item-width: 800px;
        --swiper-item-height: 100px;
        --mask-width: 50px;
    }

    body {
        width: 100vw;
        height: 100vh;
        background-color: #f0f0f0;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .swiper-wrap {
        height: var(--swiper-item-height);
        max-width: var(--swiper-item-width);
        width: 100%;
        background-color: #ffffff;
        position: relative;
        overflow: hidden;
        margin: 0 auto;
    }

    .swiper-mask {
        position: absolute;
        top: 0;
        bottom: 0;
        width: var(--mask-width);
        z-index: 2;
    }

    .swiper-mask-left {
        left: 0;
        background: linear-gradient(to right, #f0f0f091, rgba(240, 240, 240, 0));
    }

    .swiper-mask-right {
        right: 0;
        background: linear-gradient(to left, #f0f0f091, rgba(240, 240, 240, 0));
    }

    .swiper-wrap .swiper-content {
        width: 100%;
        height: var(--swiper-item-height);
        display: flex;
        justify-content: flex-start;
        align-items: center;
        will-change: transform;
    }

    /* 
    flex-grow 和 flex-shrink 是 CSS Flexbox 布局中的两个核心属性，用于控制弹性项目（flex items）在主轴方向上如何分配剩余空间或收缩以适应容器。它们只在父容器为 display: flex 或 display: inline-flex 时生效。
    所有 flex-grow > 0 的项目按比例瓜分剩余空间。
    
    */
    .swiper-wrap .swiper-item {
        /**
         *.swiper-item 在 .swiper-content 里，而 .swiper-content 是 display: flex（横向主轴）。
         * flex: 0 0 100% 等价于：
         * flex-grow: 0（不分配剩余空间）
         * flex-shrink: 0（不允许被压缩）
         * flex-basis: 100%（初始主轴尺寸 = 100%）
         * 这里的 100% 指的是“flex 容器的主轴尺寸”，也就是 .swiper-content 的宽度（更准确：它的 content box 主轴可用尺寸）。
         * 所以：每个 .swiper-item 的宽度 = .swiper-content 的宽度。
         * .swiper-content 的宽度 = 它父元素 .swiper-wrap 的宽度。
        */
        height: var(--swiper-item-height);
        flex: 0 0 100%;
        background-color: #707070;
    }

    .swiper-wrap .swiper-item:nth-child(odd) {
        background-color: #a0a0a0;
    }
</style>

<script>
    const swiperWrap = document.querySelector('.swiper-wrap');
    const swiperContent = document.querySelector('.swiper-content');
    const maskLeft = document.querySelector('.swiper-mask-left');
    const maskRight = document.querySelector('.swiper-mask-right');

    const data = [1, 2, 3, 4];
    const leftIndex = data.length;
    const rightIndex = 2 * data.length - 1;

    let itemWidth = 0;
    let currentIndex = leftIndex; // 从中间开始
    let intervalId = 0;


    // 新增：过渡锁，避免快速点击导致 transitionend 延迟/错乱
    let isTransitioning = false;

    // 创建一个轮播项元素
    function createSwiperItem(content) {
        const item = document.createElement('div');
        item.classList.add('swiper-item');
        item.textContent = content;
        return item;
    }

    // 初始化轮播内容
    function initSwiperContent(container) {
        container.innerHTML = '';
        for (let i = 0; i < 3; i++) data.forEach(num => container.appendChild(createSwiperItem(num)));
    }

    // 测量轮播项宽度
    function measure() {
        const first = swiperContent.querySelector('.swiper-item');
        if (!first) return;
        itemWidth = first.getBoundingClientRect().width;
    }

    // 应用位移变换
    function applyTransform(animate) {
        swiperContent.style.transition = animate ? 'transform 0.5s ease-in-out' : 'none';
        swiperContent.style.transform = `translateX(${-currentIndex * itemWidth}px)`;
    }

    // 下一张
    function nextSlide() {
        if (isTransitioning) return; // 关键：过渡中不再叠加
        isTransitioning = true;
        currentIndex++;
        applyTransform(true);
    }

    // 上一张
    function prevSlide() {
        if (isTransitioning) return; // 关键：过渡中不再叠加
        isTransitioning = true;
        currentIndex -= 1;
        applyTransform(true);
    }

    // 过渡结束,解除锁定,并做无缝衔接修正
    function onTransitionFinish(e) {
        if (e.propertyName !== 'transform') return;

        // 先解除锁（后面若需要瞬移修正，也是同步完成）
        isTransitioning = false;

        // 无缝循环修正：瞬移到对应位置（不带动画）
        if (currentIndex > rightIndex) {
            currentIndex = leftIndex;
            applyTransform(false);
        } else if (currentIndex < leftIndex) {
            currentIndex = rightIndex;
            applyTransform(false);
        }
    }
    /*
    * transitionend 只会在“最后一次过渡真正结束”时触发。你快速连续点击时，前一次 transition 会被后一次打断/覆盖，因此你会感觉它“不能及时响应”。解决思路：在过渡进行中锁住交互（或做队列），并同时监听
    */
    swiperContent.addEventListener('transitionend', onTransitionFinish);
    // 新增：被打断/取消时也要收尾（某些情况下会触发）
    swiperContent.addEventListener('transitioncancel', onTransitionFinish);

    initSwiperContent(swiperContent);
    measure();

    applyTransform(false);
    start();

    function start() {
        if (intervalId) clearInterval(intervalId);
        intervalId = setInterval(nextSlide, 2000);
    }

    function stop() {
        if (intervalId) clearInterval(intervalId);
    }
    // 防抖
    let resizeTimer = 0;
    window.addEventListener('resize', () => {
        // 打断transition,
        // 但是transitioncancel可能不会触发
        /**
         * transitioncancel 触发的常见情况
         * 1. 元素在 transition 过程中被移除box.remove(); // 立即触发 transitioncancel
         * 2. transition 相关的 CSS 属性被 JavaScript 强制覆盖（且新值不触发动画）
         * 3. 元素的 display 被设为 none
         * 4. 页面跳转、标签页切换到后台（部分浏览器行为）
         * 5. 父元素被隐藏（如 visibility: hidden 或 display: none）
         * 6. 通过 animation 或其他方式干扰了 transition 的执行上下文
         */
        // 当applyTransform(false);后再次applyTransform(false);,不会触发 transitionend
        // 解决方案,加一个防抖
        if (resizeTimer) clearTimeout(resizeTimer);
        stop(); // 可选：缩放过程中先停掉自动播放，避免竞态
        resizeTimer = setTimeout(() => {
            // 关键：resize 可能打断 transition，但不一定触发 transitionend/transitioncancel
            isTransitioning = false;
            console.log('resize debounce');
            // 等布局稳定后再量尺寸更稳
            requestAnimationFrame(() => {
                measure();
                applyTransform(false); // 用新宽度瞬移到当前位置
                start();               // 恢复播放
                console.log('resize', itemWidth);
            });
        }, 500);
    });

    swiperWrap.addEventListener('mouseenter', stop);
    swiperWrap.addEventListener('mouseleave', start);

    // 现在可以“给遮罩挂载方法”
    maskLeft.addEventListener('click', prevSlide);
    maskRight.addEventListener('click', nextSlide);

    // 页面切换标签页时，暂停动画，切回时继续
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') {
            stop();
        } else {
            measure();
            applyTransform(false);
            start();
        }
    });
</script>

</html>
