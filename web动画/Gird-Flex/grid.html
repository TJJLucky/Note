<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
</head>

<body>
    <div class="container container1">
        <div class="item item-1">item 1</div>
        <div class="item item-2">item 2</div>
        <div class="item item-3">item 3</div>
        <div class="item item-4">item 4</div>
        <div class="item item-5">item 5</div>
        <div class="item item-6">item 6</div>
    </div>
    <div class="container container2">
        <div class="item item-1">header</div>
        <div class="item item-2">sidebar</div>
        <div class="item item-3">content</div>
        <div class="item item-4">footer</div>
        <div class="item item-5">item 5</div>
        <div class="item item-6">item 6</div>
    </div>
    <div class="container container3">
        <div class="item item1">item 1</div>
        <div class="item item2">item 2</div>
        <div class="item item3">item 3</div>
        <div class="item item4">item 4</div>
        <div class="item item5">item 5</div>
        <div class="item item6">item 6</div>
        <div class="item item7">item 7</div>
        <div class="item item8">item 8</div>
        <div class="item item9">item 9</div>
    </div>

</body>
<style>
    .container {
        background-color: #f0f0f0;
        max-width: 800px;
        width: 100%;
        height: 800px;
        margin: 0 auto;
        border: 10px solid #ccc;
        box-sizing: border-box;
    }

    .item {
        background-color: #4caf50;
        border: 5px solid blue;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        border-radius: 5px;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
    }

    .container1 {
        display: grid;
        /* grid-template-columns: minmax(300px, 1fr) 1fr 1fr; */
        grid-template-columns: repeat(5, 100px);
        grid-template-rows: repeat(5, 100px);
        align-content: center;
        /* Distributed alignment */
        /* justify-content: space-between; */
        /* 均匀排列每个元素 首个元素放置于起点，末尾元素放置于终点 */

        /* justify-content: space-around; */
        /* 均匀排列每个元素 每个元素周围分配相同的空间 */

        /* justify-content: space-evenly; */
        /* 均匀排列每个元素 每个元素之间的间隔相等 */

        /* justify-content: stretch; */
        /* 均匀排列每个元素'auto'-sized 的元素会被拉伸以适应容器的大小 */

        justify-content: space-evenly;

        /**
         * safe
         * 果元素溢出对齐容器，则元素将按照对齐模式为 start 进行对齐。所期望的对齐将不会被实现。
         * unsafe
         * 使元素溢出对齐容器，也会实现所需的对齐方式。与 safe 不同，safe 会忽略所要求的对齐方式以防止溢出。
         */

        align-items: center;
        justify-items: safe center;

        gap: 10px;

        grid-auto-rows: 30px;

        /* 逐列填充来排列元素，在必要时增加新列。 */
        /** dense
        * 该关键字指定自动布局算法使用一种“稠密”堆积算法，如果后面出现了稍小的元素，则会试图去填充网格中前面留下的空白。这样做会填上稍大元素留下的空白，但同时也可能导致原来出现的次序被打乱。
        * 如果省略它，使用一种「稀疏」算法，在网格中布局元素时，布局算法只会「向前」移动，永远不会倒回去填补空白。这保证了所有自动布局元素「按照次序」出现，即使可能会留下被后面元素填充的空白。 */
        grid-auto-flow: column dense;

    }

    @media (max-width: 800px) {
        .container1 {
            grid-template-columns: 1fr 1fr;
        }
    }

    .container1 .item-1 {
        grid-row: 3/-2;

        grid-column-start: 4;
        grid-column-end: -2;

    }

    .container1 .item-2 {
        grid-column: 1 / span 2;
        grid-row: span 2;
        order: -1;
    }

    .container1 .item-3 {
        grid-column: 2 / span 2;
        grid-row: 1 / span 2;
    }

    .container1 .item-4 {
        grid-column: span 2;
        grid-row: span 2;
    }

    .container2 {
        display: grid;
        grid-template-columns: 200px 1fr;
        grid-template-rows: 100px 1fr 100px;
        gap: 10px;
        padding: 10px;
        grid-template-areas:
            ". header"
            "sidebar content"
            "footer footer";

        grid-auto-rows: 150px;
        /* grid-auto-flow: column; */
        grid-auto-flow: row;
    }

    .container2 .item-1 {
        grid-area: header;
    }

    .container2 .item-2 {
        grid-area: sidebar;
    }

    .container2 .item-3 {
        grid-area: content;
    }

    .container2 .item-4 {
        grid-area: footer;
    }

    .container3 {
        width: 80%;
        max-width: 950px;
        display: grid;
        /* 容器足够大时的区别 */
        /* auto-fit 折叠空轨道，项目可能被拉伸，但容器内没有留白 */
        /* grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); */
        /* auto-fill 保留空轨道，项目不被拉伸，容器内可能留白 */
        grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
    }
</style>

</html>
